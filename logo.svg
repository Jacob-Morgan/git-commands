<svg width="512" height="256" viewBox="0 0 512 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="git-commands">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F05133"/>
      <stop offset="1" stop-color="#C9472B"/>
    </linearGradient>
  </defs>

  <!-- Git branch graph: one trunk, two branches off a commit -->
  <g transform="translate(96 40)" stroke="url(#g)" stroke-width="12" fill="none" stroke-linecap="round">
    <!-- trunk -->
    <line x1="24" y1="36" x2="24" y2="140"/>
    <!-- branch out to the right -->
    <path d="M24 92 C 24 132, 96 108, 96 148"/>
  </g>

  <!-- commit nodes -->
  <g fill="url(#g)">
    <circle cx="120" cy="76" r="18"/>
    <circle cx="120" cy="180" r="18"/>
    <circle cx="192" cy="188" r="18"/>
  </g>
  <g fill="#1B1F23">
    <circle cx="120" cy="76" r="7"/>
    <circle cx="120" cy="180" r="7"/>
    <circle cx="192" cy="188" r="7"/>
  </g>

  <!-- wordmark -->
  <text x="248" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="46" font-weight="700" fill="#24292F">git</text>
  <text x="248" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="30" font-weight="500" fill="#57606A">commands</text>
</svg>
